<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORGE-Vision — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0D2461;
    --navy-mid: #162d72;
    --silver: #C0C0C0;
    --silver-light: #E8E8E8;
    --white: #FFFFFF;
    --text-dim: rgba(255,255,255,0.65);
    --error: #FF6B6B;
  }

  html, body {
    height: 100%;
    font-family: 'Montserrat', sans-serif;
    background: var(--navy);
    overflow: hidden;
  }

  /* Animated starfield background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 85%, rgba(192,192,192,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 15%, rgba(255,255,255,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #112878 0%, #0D2461 40%, #080f2e 100%);
    pointer-events: none;
  }

  /* Subtle dot grid */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  /* Glass card */
  .card {
    width: 100%;
    max-width: 460px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(192,192,192,0.25);
    border-radius: 20px;
    padding: 3rem 3rem 2.5rem;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08) inset,
      0 32px 80px rgba(0,0,0,0.5),
      0 8px 32px rgba(0,0,0,0.3);
    animation: fadeIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 2rem;
  }

  .logo-ring {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 2px solid rgba(192,192,192,0.4);
    padding: 3px;
    margin-bottom: 1.2rem;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(192,192,192,0.1), 0 0 0 8px rgba(192,192,192,0.04);
    overflow: hidden;
  }

  .logo-ring img {
    width: 80%;
    height: 80%;
    object-fit: contain;
    border-radius: 50%;
  }

  .brand-name {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--white);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .brand-name em {
    color: var(--silver);
    font-style: normal;
  }

  .tagline {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 0.4rem;
  }

  .silver-rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(192,192,192,0.4), transparent);
    margin: 1.8rem 0;
  }

  .form-heading {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 0.25rem;
  }

  .form-sub {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 1.8rem;
    font-weight: 400;
  }

  .field { margin-bottom: 1.2rem; }

  label {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--silver);
    margin-bottom: 0.5rem;
  }

  .input-wrap { position: relative; }

  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.9rem;
    color: rgba(192,192,192,0.5);
    pointer-events: none;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    padding: 0.8rem 1rem 0.8rem 2.5rem;
    border: 1px solid rgba(192,192,192,0.25);
    border-radius: 10px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9rem;
    color: var(--white);
    background: rgba(13,36,97,0.6);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input::placeholder { color: rgba(255,255,255,0.25); }

  input:focus {
    border-color: var(--silver);
    box-shadow: 0 0 0 3px rgba(192,192,192,0.12);
  }

  input.error-field {
    border-color: var(--error);
    box-shadow: 0 0 0 3px rgba(255,107,107,0.12);
  }

  .toggle-pw {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    color: rgba(192,192,192,0.5);
    padding: 4px;
    transition: color 0.2s;
  }
  .toggle-pw:hover { color: var(--silver); }

  .field-error {
    color: var(--error);
    font-size: 0.75rem;
    margin-top: 0.3rem;
    display: none;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.6rem;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.83rem;
    color: var(--text-dim);
    cursor: pointer;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 400;
  }
  .checkbox-label input {
    width: 15px;
    height: 15px;
    accent-color: var(--silver);
  }

  .forgot {
    font-size: 0.83rem;
    color: var(--silver);
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid rgba(192,192,192,0.35);
    padding-bottom: 1px;
    transition: border-color 0.2s;
  }
  .forgot:hover { border-color: transparent; }

  /* Silver gradient button */
  .btn-submit {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, #d4d4d4 0%, #a0a0a0 50%, #c8c8c8 100%);
    color: var(--navy);
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .btn-submit:hover {
    opacity: 0.9;
    box-shadow: 0 6px 28px rgba(0,0,0,0.4);
  }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2.5px solid rgba(13,36,97,0.2);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .global-error {
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.3);
    color: var(--error);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
    font-size: 0.82rem;
    margin-bottom: 1.1rem;
    display: none;
  }

  .card-bottom {
    margin-top: 1.6rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .register-link {
    font-size: 0.84rem;
    color: var(--text-dim);
  }
  .register-link a {
    color: var(--silver-light);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid rgba(232,232,232,0.35);
    padding-bottom: 1px;
  }

  .gdpr {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="logo-area">
      <div class="logo-ring">
        <img src="logo3.jpg" alt="FORGE-Vision">
      </div>
      <div class="brand-name">FORGE<em>—</em>VISION</div>
      <div class="tagline">AI Employee Training System</div>
    </div>

    <div class="silver-rule"></div>

    <div class="form-heading">Sign In</div>
    <div class="form-sub">Enter your credentials to access the platform.</div>

    <div class="global-error" id="globalError"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
        </div>
        <div class="field-error" id="emailErr">Please enter a valid email.</div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔑</span>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
        </div>
        <div class="field-error" id="pwErr">Password is required.</div>
      </div>

      <div class="row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember"> Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Access Platform</span>
      </button>
    </form>

    <div class="card-bottom">
      <div class="register-link">No account? <a href="#">Request access</a></div>
      <div class="gdpr">🔒 Secured · GDPR Compliant · AES-256 Encrypted</div>
    </div>
  </div>
</div>

<script>
function togglePw() {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const email     = document.getElementById('email');
  const pw        = document.getElementById('password');
  const emailErr  = document.getElementById('emailErr');
  const pwErr     = document.getElementById('pwErr');
  const globalErr = document.getElementById('globalError');
  let valid = true;

  emailErr.style.display = 'none'; email.classList.remove('error-field');
  pwErr.style.display    = 'none'; pw.classList.remove('error-field');
  globalErr.style.display = 'none';

  if (!email.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
    emailErr.style.display = 'block'; email.classList.add('error-field'); valid = false;
  }
  if (!pw.value) {
    pwErr.style.display = 'block'; pw.classList.add('error-field'); valid = false;
  }
  if (!valid) return;

  const btn     = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');
  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = 'Authenticating…';

  setTimeout(() => {
    btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Access Platform';
    globalErr.textContent = 'Invalid credentials. Please check and try again.';
    globalErr.style.display = 'block';
  }, 1800);
});
</script>
</body>
</html>
