<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORGE-Vision — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #FFCC00;
    --gold-dark: #E6B800;
    --gold-light: #FFD740;
    --white: #FFFFFF;
    --black: #111111;
    --grey: #888888;
    --light-grey: #F5F5F5;
    --error: #D32F2F;
  }

  html, body {
    min-height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(0,0,0,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .card {
    position: relative;
    background: var(--white);
    border-radius: 20px;
    padding: 3rem 3rem 2.5rem;
    width: 100%;
    max-width: 440px;
    box-shadow:
      0 4px 6px rgba(0,0,0,0.04),
      0 20px 60px rgba(0,0,0,0.16),
      0 1px 0 rgba(255,255,255,0.8) inset;
    animation: rise 0.55s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 2rem;
  }

  .logo-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.1rem;
    box-shadow: 0 4px 20px rgba(255,204,0,0.5);
    overflow: hidden;
  }

  .logo-circle img {
    width: 80%;
    height: 80%;
    object-fit: contain;
  }

  .brand {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--black);
  }

  .brand span {
    color: var(--gold-dark);
  }

  .tagline {
    font-size: 0.75rem;
    color: var(--grey);
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 0.3rem;
  }

  .divider-line {
    border: none;
    border-top: 1px solid #EBEBEB;
    margin: 0 0 1.8rem;
  }

  .form-heading {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--black);
    margin-bottom: 0.2rem;
  }

  .form-sub {
    font-size: 0.82rem;
    color: var(--grey);
    margin-bottom: 1.6rem;
  }

  .field { margin-bottom: 1.2rem; }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 0.45rem;
  }

  .input-wrap { position: relative; }

  .input-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.95rem;
    color: #bbb;
    pointer-events: none;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    padding: 0.78rem 1rem 0.78rem 2.5rem;
    border: 1.5px solid #E8E8E8;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.93rem;
    color: var(--black);
    background: var(--light-grey);
    outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--gold);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(255,204,0,0.15);
  }

  input.error-field {
    border-color: var(--error);
    background: #fff5f5;
  }

  .toggle-pw {
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    color: #bbb;
    padding: 4px;
    transition: color 0.2s;
  }
  .toggle-pw:hover { color: var(--black); }

  .field-error {
    color: var(--error);
    font-size: 0.76rem;
    margin-top: 0.28rem;
    display: none;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.85rem;
    color: var(--grey);
    cursor: pointer;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 400;
  }
  .checkbox-label input {
    width: 15px;
    height: 15px;
    accent-color: var(--gold-dark);
  }

  .forgot {
    font-size: 0.85rem;
    color: var(--black);
    font-weight: 600;
    text-decoration: none;
    position: relative;
  }
  .forgot::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 1.5px;
    background: var(--gold);
    transform-origin: left;
    transition: transform 0.2s;
  }
  .forgot:hover::after { transform: scaleX(0); }

  .btn-submit {
    width: 100%;
    padding: 0.9rem;
    background: var(--white);
    color: var(--gold-dark);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    border: 2px solid var(--gold);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: background 0.2s, color 0.2s, transform 0.1s, box-shadow 0.2s;
  }
  .btn-submit:hover {
    background: var(--gold);
    color: var(--black);
    box-shadow: 0 4px 16px rgba(255,204,0,0.4);
  }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2.5px solid rgba(200,160,0,0.25);
    border-top-color: var(--gold-dark);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .global-error {
    background: #fff5f5;
    border: 1.5px solid #f5c2c2;
    color: var(--error);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
    font-size: 0.85rem;
    margin-bottom: 1.1rem;
    display: none;
  }

  .or-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin: 1.4rem 0 1rem;
  }
  .or-row::before, .or-row::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #EBEBEB;
  }
  .or-row span {
    font-size: 0.72rem;
    color: #ccc;
    letter-spacing: 0.06em;
    font-weight: 500;
  }

  .register-link {
    text-align: center;
    font-size: 0.87rem;
    color: var(--grey);
  }
  .register-link a {
    color: var(--black);
    font-weight: 700;
    text-decoration: none;
    border-bottom: 1.5px solid var(--gold);
    padding-bottom: 1px;
  }

  .card-footer {
    margin-top: 1.8rem;
    text-align: center;
  }

  .gdpr {
    font-size: 0.73rem;
    color: #bbb;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo-area">
    <div class="logo-circle">
      <img src="logo2.jpg" alt="FORGE-Vision">
    </div>
    <div class="brand">FORGE<span>·</span>VISION</div>
    <div class="tagline">AI Employee Training System</div>
  </div>

  <hr class="divider-line">

  <div class="form-heading">Welcome back</div>
  <div class="form-sub">Sign in to your account to continue.</div>

  <div class="global-error" id="globalError"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">✉</span>
        <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="field-error" id="emailErr">Please enter a valid email address.</div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔑</span>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
      </div>
      <div class="field-error" id="pwErr">Password is required.</div>
    </div>

    <div class="row">
      <label class="checkbox-label">
        <input type="checkbox" id="remember"> Remember me
      </label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Sign In →</span>
    </button>
  </form>

  <div class="or-row"><span>OR</span></div>
  <div class="register-link">No account? <a href="#">Register here</a></div>

  <div class="card-footer">
    <div class="gdpr">🔒 Secured · GDPR Compliant · AES-256 Encrypted</div>
  </div>
</div>

<script>
function togglePw() {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const email     = document.getElementById('email');
  const pw        = document.getElementById('password');
  const emailErr  = document.getElementById('emailErr');
  const pwErr     = document.getElementById('pwErr');
  const globalErr = document.getElementById('globalError');
  let valid = true;

  emailErr.style.display = 'none'; email.classList.remove('error-field');
  pwErr.style.display    = 'none'; pw.classList.remove('error-field');
  globalErr.style.display = 'none';

  if (!email.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
    emailErr.style.display = 'block'; email.classList.add('error-field'); valid = false;
  }
  if (!pw.value) {
    pwErr.style.display = 'block'; pw.classList.add('error-field'); valid = false;
  }
  if (!valid) return;

  const btn     = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btnText');
  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = 'Signing in…';

  setTimeout(() => {
    btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Sign In →';
    globalErr.textContent = 'Invalid email or password. Please try again.';
    globalErr.style.display = 'block';
  }, 1800);
});
</script>
</body>
</html>
