; FORGE-Vision — Hugging Face Space process manager.
; Caddy (public :7860) reverse-proxies to FastAPI (:8000) and Streamlit (:8501)
; in one container. HF Spaces expose a single HTTP port (app_port: 7860).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=uvicorn src.api.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

[program:ui]
command=streamlit run src/ui/app.py
    --server.port 8501
    --server.address 0.0.0.0
    --server.headless true
    --server.enableCORS false
    --server.enableXsrfProtection false
    --browser.gatherUsageStats false
directory=/app
autostart=true
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",API_BASE_URL="http://localhost:8000",UI_STANDALONE_LOGIN="1"

[program:caddy]
command=caddy run --config /app/space/Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
startsecs=2
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
