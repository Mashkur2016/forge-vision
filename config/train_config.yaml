# FORGE-Vision Training Configuration
# All hyperparameters and paths — never hardcode these in source files.
# Rules.md §1.3: all config lives here, not in code.
# Rules.md §1.5: fixed seeds for reproducibility.

# ── Reproducibility ────────────────────────────────────────────────────────
seed: 42

# ── Paths ──────────────────────────────────────────────────────────────────
paths:
  sops_dir: "data/sops"
  synthetic_dir: "data/synthetic"
  real_dir: "data/real"          # Phase B — not used until Phase 3
  models_dir: "models"
  experiments_dir: "experiments"

# ── Dataset ────────────────────────────────────────────────────────────────
dataset:
  val_split: 0.15                # 15% of clips held out for validation
  test_split: 0.10               # 10% held out for final test
  clip_sample_frames: 16         # frames uniformly sampled per clip for model input
  frame_size: [224, 224]         # H × W resized for model input
  normalize_mean: [0.485, 0.456, 0.406]   # ImageNet mean (used for pretrained backbones)
  normalize_std: [0.229, 0.224, 0.225]    # ImageNet std

# ── Action Recognition (CNN+LSTM) ──────────────────────────────────────────
action_recognition:
  # Architecture
  backbone: "mobilenet_v3_small"   # lightweight CNN feature extractor
  feature_dim: 576                 # output dim of MobileNetV3-Small
  lstm_hidden_size: 256
  lstm_num_layers: 2
  lstm_dropout: 0.3
  num_classes: 25                  # max SOP steps across all SOPs + 1 (idle)

  # Training
  epochs: 50
  batch_size: 16
  learning_rate: 0.001
  lr_scheduler: "cosine"          # cosine annealing
  lr_min: 0.00001
  weight_decay: 0.0001
  gradient_clip: 1.0

  # Early stopping
  patience: 10                    # stop if val loss doesn't improve for N epochs
  min_delta: 0.001

  # Target accuracy (Rules.md §1.7)
  target_accuracy: 0.80

  # Phase 5 thesis validation targets — gated during academic evaluation (Phase 5)
  # Macro F1 treats all 5 scenario classes equally (avoids majority-class bias).
  # Top-3 accuracy guards against total misclassification in safety-critical context.
  target_macro_f1: 0.80             # Phase 5: unweighted average F1 across all classes
  target_top3_accuracy: 1.00        # Phase 5: correct class must always be in top-3 predictions

# ── SOP Sequence Model (LSTM) ──────────────────────────────────────────────
sequence_model:
  input_dim: 25                   # action class embedding dim (= num_classes above)
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  num_deviation_classes: 6        # correct + 5 error types

  epochs: 30
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.0001

  target_accuracy: 0.75           # error detection target (Rules.md §1.7)

# ── Pose Estimation ────────────────────────────────────────────────────────
pose_estimation:
  model_complexity: 1             # MediaPipe: 0=lite, 1=full, 2=heavy
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  target_accuracy: 0.85           # Rules.md §1.7

# ── Object Detection (YOLOv8n) ─────────────────────────────────────────────
object_detection:
  model: "yolov8n.pt"             # nano — edge-compatible (Rules.md edge constraint)
  conf_threshold: 0.4
  iou_threshold: 0.45
  img_size: 640
  device: "auto"                  # "cpu", "cuda", or "auto"

  # Fine-tuning on workplace objects
  finetune_epochs: 20
  finetune_lr: 0.0001
  finetune_batch_size: 8

# ── MLflow ─────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: "experiments/mlruns"
  experiment_name: "forge-vision-phase2"

# ── Edge deployment targets (Phase B) ─────────────────────────────────────
edge:
  quantize: true                  # INT8 quantization for Jetson deployment
  target_latency_ms: 500          # per-component latency budget
  max_model_size_mb: 50
